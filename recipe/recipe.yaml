schema_version: 1

context:
  name: zmq-anyio
  version: "0.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/zmq_anyio-${{ version }}.tar.gz
  sha256: 0c11c2fe0657987d545380d500e82587c0b636c67c98490f2c2682b2dcc96196

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - uv-build
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - anyio >=4.15.0,<5.0.0
    - pyzmq >=27.1.0,<28.0.0
    - typing_extensions >=4.15.0,<5.0.0

tests:
  - python:
      imports:
        - zmq_anyio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Asynchronous API for ZMQ using AnyIO
  homepage: https://github.com/QuantStack/zmq-anyio
  repository: https://github.com/QuantStack/zmq-anyio

extra:
  recipe-maintainers:
    - davidbrochart
