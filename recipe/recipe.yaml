schema_version: 1

context:
  name: zmq-anyio
  version: "0.3.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/zmq_anyio-${{ version }}.tar.gz
  sha256: 1ec77999f62f576bacfa020f3aa11491da54d1bed7a77af8505b3add7da2366b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - uv-build
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - anyio >=4.13.0,<5.0.0
    - anyioutils >=0.7.4,<0.8.0
    - pyzmq >=27.1.0,<28.0.0

tests:
  - python:
      imports:
        - zmq_anyio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Asynchronous API for ZMQ using AnyIO
  homepage: https://github.com/QuantStack/zmq-anyio
  repository: https://github.com/QuantStack/zmq-anyio

extra:
  recipe-maintainers:
    - davidbrochart
